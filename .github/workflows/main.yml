name: Build Android APK (Debug & Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug assembleRelease
          elif [ -f "DroidCamAlternative/settings.gradle.kts" ]; then
            cd DroidCamAlternative && gradle assembleDebug assembleRelease
          else
            echo "Folder proyek Android tidak ditemukan!"
            ls -la
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCamAlternative-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCamAlternative-release-apk
          path: "**/app/build/outputs/apk/release/app-release.apk"
